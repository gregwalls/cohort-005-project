[tools]
node = "22"

[tasks.install]
description = "Install npm dependencies"
run = "npm install"

[tasks.dev]
description = "Start the dev server"
run = "npm run dev"

[tasks.typecheck]
description = "Run typegen and tsc"
run = "npm run typecheck"

[tasks.test]
description = "Run vitest"
run = "npm run test"

[tasks.verify]
description = "Typecheck, then test"
depends = ["typecheck"]
run = "npm run test"
